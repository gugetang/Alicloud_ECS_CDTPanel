# 部署安全：反代不一定在本机，所以 1999 不能只绑 127.0.0.1（远端反代连不上）。
# 端口正常发布，应用层拦截直访：CDT_PROXY_ONLY=1 时面板只接受带反代转发标识头
#（X-Forwarded-For / X-Forwarded-Proto / CF-Connecting-IP）的请求，
# 直接用服务器 IP:端口打开会被 403；反代（本机或远端）转发的请求正常访问。
# 项目本身不申请、不续期、不管理证书，见 README“部署安全”。
services:
  Alicloud_ECS_CDTPanel:
    # latest 永远等于已发布版本：部署和更新都只拉 latest，
    # main 上有了新提交、版本号变了，但没发新版本时，拉 latest 还是已发布版本。
    image: ghcr.io/gugetang/alicloud_ecs_cdtpanel:latest
    container_name: Alicloud_ECS_CDTPanel
    restart: unless-stopped
    init: true
    ports:
      - "1999:1999"
    environment:
      TZ: Asia/Shanghai
      CDT_DATA_DIR: /data
      # 只接受经过反代的请求：直接用 IP:端口打开会被 403。
      CDT_PROXY_ONLY: "1"
    volumes:
      - /opt/docker/cdt-alicloud_ecs_cdtpanel:/data
      # 在线更新用：面板通过 Docker socket 拉镜像并重建自身容器。
      # 首次启用须手动 docker compose pull && docker compose up -d 一次。
      - /var/run/docker.sock:/var/run/docker.sock
