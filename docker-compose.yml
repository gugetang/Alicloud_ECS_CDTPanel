# 部署安全：1999 只发布在本机回环地址上（127.0.0.1:1999），
# 服务器 IP:1999 从外面打不开；想访问面板，必须在前面配自己的反代
#（Nginx / Caddy / Cloudflare 等）+ 自己的证书，反代指向 127.0.0.1:1999。
# 项目本身不申请、不续期、不管理证书，见 README“部署安全”。
services:
  Alicloud_ECS_CDTPanel:
    image: ghcr.io/gugetang/alicloud_ecs_cdtpanel:latest
    container_name: Alicloud_ECS_CDTPanel
    restart: unless-stopped
    init: true
    # 只绑本机回环：外网用 IP:1999 打不开；本机上的反代可以访问 127.0.0.1:1999。
    ports:
      - "127.0.0.1:1999:1999"
    environment:
      TZ: Asia/Shanghai
      CDT_DATA_DIR: /data
      # 可选：配了以后面板只认这个域名 Host，IP / 其它 Host 直接 403；
      # 不配则不限制。写在同目录 .env 里：CDT_PUBLIC_DOMAIN=cdt.example.com
      CDT_PUBLIC_DOMAIN: ${CDT_PUBLIC_DOMAIN:-}
    volumes:
      - /opt/docker/cdt-alicloud_ecs_cdtpanel:/data
