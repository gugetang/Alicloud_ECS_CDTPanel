# 构建镜像并推送到 GHCR（GitHub Container Registry）。
# 触发：push 到 main 分支，或打 v* 发布标签；
# main 构建推 latest + 提交 SHA，标签构建再多推一个版本标签
# （如 v2.1.0），新部署只拉版本标签，不跟 main 的最新代码。
# 镜像名与 docker-compose.yml 一致：
# ghcr.io/gugetang/alicloud_ecs_cdtpanel（GHCR 镜像名必须全小写）。
name: docker

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 完整历史 + 标签：git describe --tags 要找最近的发布标签
          fetch-depth: 0
      - name: 确定版本号
        id: version
        run: |
          echo "version=$(git describe --tags --always)" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
      - name: 确定镜像标签
        id: tags
        run: |
          tags="ghcr.io/gugetang/alicloud_ecs_cdtpanel:latest
          ghcr.io/gugetang/alicloud_ecs_cdtpanel:${{ github.sha }}"
          # 发布标签触发时（如 v2.1.0）：再推一个版本标签，
          # 新部署只拉这个版本标签，不跟 main 的最新代码。
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            tags="$tags
          ghcr.io/gugetang/alicloud_ecs_cdtpanel:${{ github.ref_name }}"
          fi
          {
            echo "list<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT_SHA=${{ steps.version.outputs.sha }}
          tags: ${{ steps.tags.outputs.list }}
