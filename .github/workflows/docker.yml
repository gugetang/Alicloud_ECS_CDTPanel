# 构建镜像并推送到 GHCR（GitHub Container Registry）。
# 触发：push 到 main 分支，或打 v* 发布标签；
# main 构建推 latest + 提交 SHA，标签构建再多推一个版本标签
# （如 v2.1.0），新部署只拉版本标签，不跟 main 的最新代码。
# 手动触发（workflow_dispatch）用于补建某个发布版本的镜像：
# tag 已经打出、但当时 workflow 还没有版本标签逻辑时，
# 在 Actions 页面手动运行一次，指定要构建的 tag 和版本标签。
# 镜像名与 docker-compose.yml 一致：
# ghcr.io/gugetang/alicloud_ecs_cdtpanel（GHCR 镜像名必须全小写）。
name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: '要构建的 tag 或分支（如 v2.1.0）'
        required: true
        default: 'v2.1.0'
      version_tag:
        description: '要推送的版本标签（如 v2.1.0，留空则不推）'
        required: false
        default: 'v2.1.0'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 完整历史 + 标签：git describe --tags 要找最近的发布标签
          fetch-depth: 0
          # 手动触发时按输入的 ref 检出（如 v2.1.0）；push 触发时用触发的 ref。
          ref: ${{ inputs.ref || github.ref }}
      - name: 确定版本号
        id: version
        run: |
          echo "version=$(git describe --tags --always)" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
      - name: 确定镜像标签
        id: tags
        run: |
          tags="ghcr.io/gugetang/alicloud_ecs_cdtpanel:latest
          ghcr.io/gugetang/alicloud_ecs_cdtpanel:${{ steps.version.outputs.sha }}"
          # 发布标签触发时（如 v2.1.0）：再推一个版本标签，
          # 新部署只拉这个版本标签，不跟 main 的最新代码。
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            tags="$tags
          ghcr.io/gugetang/alicloud_ecs_cdtpanel:${{ github.ref_name }}"
          fi
          # 手动触发时按输入的版本标签推。
          if [[ -n "${{ inputs.version_tag }}" ]]; then
            tags="$tags
          ghcr.io/gugetang/alicloud_ecs_cdtpanel:${{ inputs.version_tag }}"
          fi
          {
            echo "list<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT_SHA=${{ steps.version.outputs.sha }}
          tags: ${{ steps.tags.outputs.list }}
