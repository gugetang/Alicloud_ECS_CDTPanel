# 构建镜像并推送到 GHCR（GitHub Container Registry）。
# push 到 main 分支时触发；镜像名与 docker-compose.yml 一致：
# ghcr.io/gugetang/alicloud_ecs_cdtpanel（GHCR 镜像名必须全小写）。
name: docker

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 完整历史 + 标签：git describe --tags 要找最近的发布标签
          fetch-depth: 0
      - name: 确定版本号
        id: version
        run: |
          echo "version=$(git describe --tags --always)" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT_SHA=${{ steps.version.outputs.sha }}
          tags: |
            ghcr.io/gugetang/alicloud_ecs_cdtpanel:latest
            ghcr.io/gugetang/alicloud_ecs_cdtpanel:${{ github.sha }}
