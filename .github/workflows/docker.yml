# 构建镜像并推送到 GHCR（GitHub Container Registry）。
# push 到 main 分支时触发；镜像名与 docker-compose.yml 一致：
# ghcr.io/gugetang/alicloud_ecs_cdtpanel（GHCR 镜像名必须全小写）。
name: docker

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/gugetang/alicloud_ecs_cdtpanel:latest
            ghcr.io/gugetang/alicloud_ecs_cdtpanel:${{ github.sha }}
