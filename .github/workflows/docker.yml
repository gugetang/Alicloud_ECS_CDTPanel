# 构建镜像并推送到 GHCR（GitHub Container Registry）。
# 规则：latest 永远等于已发布版本。
# - push 到 main：只推提交 SHA 标签，不动 latest；
# - 打 v* 发布标签：推 latest + 版本标签（如 v2.1.0）+ SHA；
# - 手动触发：补建旧发布版本的版本标签（如 v2.1.0），不动 latest。
# 新部署只拉版本标签；拉 latest 拉到的也是已发布版本。
# 镜像名与 docker-compose.yml 一致：
# ghcr.io/gugetang/alicloud_ecs_cdtpanel（GHCR 镜像名必须全小写）。
name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: '要构建的 tag 或分支（默认 v2.1.0）'
        required: false
        default: 'v2.1.0'
      version_tag:
        description: '要推送的版本标签（默认 v2.1.0）'
        required: false
        default: 'v2.1.0'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 完整历史 + 标签：git describe --tags 要找最近的发布标签
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}
      - name: 确定版本号
        id: version
        run: |
          echo "version=$(git describe --tags --always)" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
      - name: 确定镜像标签
        id: tags
        run: |
          tags="ghcr.io/gugetang/alicloud_ecs_cdtpanel:${{ steps.version.outputs.sha }}"
          # 发布标签触发时（如 v2.1.0）：推 latest + 版本标签，
          # latest 永远等于已发布版本。
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            tags="$tags
          ghcr.io/gugetang/alicloud_ecs_cdtpanel:latest
          ghcr.io/gugetang/alicloud_ecs_cdtpanel:${{ github.ref_name }}"
          fi
          # 手动触发（补建旧发布版本，如 v2.1.0）：只推版本标签，不动 latest。
          if [[ -n "${{ inputs.version_tag }}" ]]; then
            tags="$tags
          ghcr.io/gugetang/alicloud_ecs_cdtpanel:${{ inputs.version_tag }}"
          fi
          {
            echo "list<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT_SHA=${{ steps.version.outputs.sha }}
          tags: ${{ steps.tags.outputs.list }}
