<svg xmlns="http://www.w3.org/2000/svg" width="350" height="160" viewBox="0 0 350 160">
  <defs>
    <filter id="aGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      /* 三处同频同相：柱体每 1.2 秒到服务器一个，服务器三点每 1.2 秒闪一次；光流 1.2s 一圈、周期 122px（约 102px/秒，和柱体同速）。dashoffset 从 28.4 起，让光流的亮段在服务器三点闪的同一刻正好到服务器（28.4 是算出来的相位，亮段中心对准服务器） */
      .aflow { stroke-dasharray: 20 102; animation: aflow 1.2s linear infinite; }
      @keyframes aflow { from { stroke-dashoffset: 28.4; } to { stroke-dashoffset: -93.6; } }
    </style>
  </defs>
  <rect width="350" height="160" fill="#ffffff"/>
  <!-- 第一部分 Ali：大写 A（圆头圆角，配圆润字体）+ li，li 和服务器靠在一起 -->
  <g stroke="#8b5cf6" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 135 L80 30 L130 135"/>
    <path d="M51 90 L109 90"/>
  </g>
  <circle cx="80" cy="30" r="7" fill="#8b5cf6"/>
  <text x="152" y="129" font-family="'Arial Rounded MT Bold', 'Helvetica Rounded', 'Century Gothic', Futura, Arial, sans-serif" font-size="115" font-weight="700" fill="#8b5cf6">li</text>
  <!-- 下面横线：从 A 右下角开始，右端与服务器图标右对齐 -->
  <line x1="130" y1="135" x2="329" y2="135" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>
  <!-- A 和横线一个整体特效：亮绿光流沿整条路径走，从 A 左脚翻过顶点、顺横线到服务器右端 -->
  <path class="aflow" d="M30 135 L80 30 L130 135 L329 135" fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#aGlow)"/>
  <!-- 绿色柱体：就一个，沿 A 翻过顶点流向服务器，3.6 秒走一趟，和光流同速；到服务器时正好赶上三点闪 -->
  <g>
    <animateMotion dur="3.6s" rotate="auto" repeatCount="indefinite" path="M30 135 L80 20 L130 135 L245 135"/>
    <rect x="-12" y="-5" width="24" height="10" rx="5" fill="#22c55e" opacity="0.25"/>
    <rect x="-9" y="-3" width="18" height="6" rx="3" fill="#22c55e"/>
    <rect x="-7" y="-2" width="14" height="2" rx="1" fill="#ffffff" opacity="0.55"/>
  </g>
  <!-- 第三部分 cloud：服务器图标（黑色），挨着 li -->
  <g stroke="#111827" stroke-width="6" fill="#ffffff" stroke-linecap="butt" stroke-linejoin="round">
    <rect x="245" y="52" width="84" height="77" rx="8"/>
    <line x1="251" y1="78" x2="323" y2="78" stroke-width="4"/>
    <line x1="251" y1="104" x2="323" y2="104" stroke-width="4"/>
    <line x1="271" y1="65" x2="315" y2="65" stroke-width="4"/>
    <line x1="271" y1="91" x2="315" y2="91" stroke-width="4"/>
    <line x1="271" y1="116" x2="315" y2="116" stroke-width="4"/>
  </g>
  <!-- 服务器里三个点：蓝/绿/红；柱体到达服务器时一起闪一下，频率和特效一致（1.2 秒一次） -->
  <circle cx="259" cy="65" r="3.5" fill="#2563eb">
    <animate attributeName="r" values="3.5;6.5;3.5" keyTimes="0;0.5;1" dur="1.2s" begin="-0.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;1;0.45" keyTimes="0;0.5;1" dur="1.2s" begin="-0.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="259" cy="91" r="3.5" fill="#22c55e">
    <animate attributeName="r" values="3.5;6.5;3.5" keyTimes="0;0.5;1" dur="1.2s" begin="-0.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;1;0.45" keyTimes="0;0.5;1" dur="1.2s" begin="-0.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="259" cy="116" r="3.5" fill="#EA4335">
    <animate attributeName="r" values="3.5;6.5;3.5" keyTimes="0;0.5;1" dur="1.2s" begin="-0.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;1;0.45" keyTimes="0;0.5;1" dur="1.2s" begin="-0.6s" repeatCount="indefinite"/>
  </circle>
</svg>
